# Regenerates an animated SVG of a "snake" eating your contribution graph every night,
# and pushes it to an `output` branch. The README embeds that SVG directly, so the
# animation — and the contribution squares it's built from — stay current automatically.

name: generate-snake-animation

on:
  schedule:
    - cron: "0 8 * * *"   # once a day (8am UTC ≈ 1am Phoenix)
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ARasugit20
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
